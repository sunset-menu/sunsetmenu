<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunset Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0d0d0d;
    --yellow:#f8b719;
    --red:#c43a2b;
    --cream:#fff3d0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--black);
    font-family:'Poppins',sans-serif;
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  /* HOŞ GELDİNİZ AÇILIŞ EKRANI */
  .welcome-screen{
    position:fixed;
    inset:0;
    z-index:9999;
    display:grid;
    place-items:center;
    padding:24px;
    background:
      radial-gradient(circle at 50% 20%, rgba(255,247,220,.22), transparent 28%),
      linear-gradient(180deg, #ffd45a 0%, var(--yellow) 52%, #e89b16 100%);
    color:var(--red);
    cursor:pointer;
    touch-action:manipulation;
    transition:opacity .75s ease, transform .75s cubic-bezier(.22,.7,.25,1);
  }
  .welcome-screen.closing{
    opacity:0;
    transform:scale(1.04);
    pointer-events:none;
  }
  .welcome-content{
    width:min(100%, 430px);
    text-align:center;
    animation:welcomeEnter 1.1s cubic-bezier(.16,.75,.2,1) both;
  }
  .welcome-sun{
    width:150px;
    margin:0 auto 14px;
    filter:drop-shadow(0 8px 12px rgba(13,13,13,.18));
    animation:welcomeSunGlow 4.8s ease-in-out infinite;
  }
  .welcome-screen.closing .welcome-sun{
    animation-play-state:paused;
  }
  @keyframes welcomeSunGlow{
    0%,100%{
      filter:drop-shadow(0 6px 10px rgba(13,13,13,.14));
    }
    50%{
      filter:drop-shadow(0 0 6px rgba(255,247,220,.8)) drop-shadow(0 10px 18px rgba(196,58,43,.35));
    }
  }
  .welcome-kicker{
    position:relative;
    top:-14px;
    margin-bottom:2px;
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.28em;
    text-transform:uppercase;
  }
  .welcome-title{
    font-family:'Great Vibes',cursive;
    font-size:clamp(3.8rem, 15vw, 6rem);
    line-height:.95;
    text-shadow:0 4px 0 rgba(13,13,13,.12);
  }
  .welcome-hint{
    margin-top:28px;
    font-size:1.05rem;
    font-weight:700;
    letter-spacing:.02em;
    opacity:.95;
    animation:hintPulse 1.8s ease-in-out infinite;
  }
  @keyframes welcomeEnter{
    from{opacity:0; transform:translateY(34px) scale(.96);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  @keyframes hintPulse{
    0%,100%{opacity:.55; transform:translateY(0);}
    50%{opacity:1; transform:translateY(-4px);}
  }

  /* İÇECEK ÖNERİCİ */
  .drink-helper{
    position:fixed;
    right:14px;
    top:50%;
    z-index:1200;
    width:118px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    transform:translateY(-50%);
  }
  .drink-sun-button{
    width:66px;
    height:66px;
    display:grid;
    place-items:center;
    padding:0;
    border:3px solid var(--red);
    border-radius:50%;
    background:var(--yellow);
    color:var(--red);
    cursor:pointer;
    box-shadow:0 5px 0 rgba(13,13,13,.28), 0 0 18px rgba(248,183,25,.3);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .drink-sun-button:hover,
  .drink-sun-button:focus-visible{
    transform:scale(1.08);
    box-shadow:0 6px 0 rgba(13,13,13,.28), 0 0 26px rgba(248,183,25,.55);
    outline:none;
  }
  .drink-sun-button:active{
    transform:scale(.96);
  }
  .drink-sun-icon{
    width:48px;
    height:48px;
    animation:drinkSunSpin 8s linear infinite;
  }
  @keyframes drinkSunSpin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  .drink-suggestion{
    width:100%;
    padding:9px 8px;
    border:2px solid var(--yellow);
    border-radius:10px;
    background:transparent;
    color:var(--red);
    text-align:center;
    font-size:.7rem;
    line-height:1.25;
    font-weight:700;
    box-shadow:none;
    pointer-events:none;
  }
  .drink-suggestion strong{
    display:block;
    margin-top:4px;
    font-size:.8rem;
  }
  .drink-suggestion.showing{
    animation:suggestionPop .45s cubic-bezier(.16,.75,.2,1);
  }
  @keyframes suggestionPop{
    0%{opacity:.2; transform:translateY(8px) scale(.94);}
    100%{opacity:1; transform:translateY(0) scale(1);}
  }

  /* HERO */
  .hero{
    background:var(--yellow);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:38px 20px 30px;
    position:relative;
    border-bottom:6px solid var(--black);
  }
  .hero .brand{
    font-family:'Great Vibes',cursive;
    color:var(--red);
    font-size:3.2rem;
    text-shadow:0 0 14px rgba(196,58,43,.55), 0 0 2px rgba(196,58,43,.8);
    line-height:1;
  }
  .sun{
    width:90px;
    height:auto;
    margin-bottom:6px;
    overflow:visible;
  }

  /* Güneş yukarıdan aşağıya, gün batımı hissiyle iner. */
  .sun-object{
    transform-box:fill-box;
    transform-origin:center bottom;
    animation:sunsetDrop 4.8s cubic-bezier(.16,.75,.2,1) .2s both;
  }

  /* Dalgalar da güneşle aynı anda aşağıdan yukarı hareket eder ve aynı anda durur. */
  .wave-object{
    transform-box:fill-box;
    transform-origin:center bottom;
    animation:waveRise 4.8s cubic-bezier(.16,.75,.2,1) .2s both;
  }

  @keyframes waveRise{
    0%{
      opacity:0;
      transform:translateY(30px) scaleX(.94);
    }
    22%{
      opacity:1;
    }
    72%{
      opacity:1;
      transform:translateY(4px) scaleX(1.02);
    }
    100%{
      opacity:1;
      transform:translateY(0) scaleX(1);
    }
  }

  @keyframes sunsetDrop{
    0%{
      opacity:0;
      transform:translateY(-160px);
    }
    22%{
      opacity:1;
    }
    84%{
      opacity:1;
      transform:translateY(5px);
    }
    100%{
      opacity:1;
      transform:translateY(0);
    }
  }
  .hero .menu-word{
    font-family:'Great Vibes',cursive;
    color:var(--red);
    font-size:3.6rem;
    text-shadow:0 0 14px rgba(196,58,43,.55), 0 0 2px rgba(196,58,43,.8);
    margin-top:-4px;
  }
  /* ACCORDION LIST */
  .accordion{
    padding:18px 14px 8px;
    max-width:560px;
    margin:0 auto;
  }
  .category{
    background:#141414;
    border:1px solid #262626;
    border-radius:14px;
    margin-bottom:12px;
    overflow:hidden;
    opacity:0;
    animation:categoryEnter 2s cubic-bezier(.16,.75,.2,1) forwards;
    animation-delay:calc(var(--category-index, 0) * 180ms);
  }

  /* Kategoriler listeye eklenirken soldan kayarak görünür. */
  @keyframes categoryEnter{
    from{
      opacity:0;
      transform:translateX(-65px);
    }
    to{
      opacity:1;
      transform:translateX(0);
    }
  }
  .category .cat-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:16px 18px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .category h2{
    font-family:'Great Vibes',cursive;
    color:var(--yellow);
    font-size:1.9rem;
    line-height:1;
  }
  .cat-header .chevron{
    flex:0 0 auto;
    width:22px;height:22px;
    color:var(--red);
    transition:transform .35s cubic-bezier(.4,0,.2,1);
  }
  .category.open .chevron{
    transform:rotate(180deg);
  }
  .cat-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .38s cubic-bezier(.4,0,.2,1);
  }
  .category.open .cat-body{
    grid-template-rows:1fr;
  }
  .cat-body-inner{
    overflow:hidden;
  }
  .cat-items{
    padding:0 18px 16px;
    border-top:1px solid rgba(247,198,0,.2);
    opacity:0;
    transform:translateX(-38px);
    transition:
      opacity .5s ease,
      transform .75s cubic-bezier(.16,.75,.2,1);
  }
  .category.open .cat-items{
    opacity:1;
    transform:translateX(0);
    transition-delay:.08s;
  }
  .item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 0;
    border-bottom:1px dotted rgba(247,198,0,.25);
    gap:12px;
  }
  .item:last-child{ border-bottom:none; }
  .item-left{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
    flex:1;
  }
  .item-image{
    width:90px;
    height:90px;
    flex:0 0 90px;
    object-fit:cover;
    border-radius:14px;
    background:#242424;
    border:1px solid rgba(247,198,0,.18);
    display:block;
  }
  .item .name{
    min-width:0;
    font-size:.95rem;
    font-weight:500;
  }
  .item .note{
    display:block;
    font-size:.72rem;
    color:#b8b8b8;
    font-weight:400;
  }
  .item .price{
    flex:0 0 auto;
    font-weight:700;
    color:var(--yellow);
    white-space:nowrap;
    font-size:.95rem;
  }
  @media (prefers-reduced-motion: reduce){
    .drink-suggestion.showing,
    .sun-object,
    .wave-object,
    .category{
      animation:none;
      opacity:1;
      transform:none;
    }
    .cat-items{
      transition:none;
      transform:none;
    }
  }

  @media (max-width:600px){
    .drink-helper{
      right:8px;
      width:104px;
    }
    .drink-sun-button{
      width:58px;
      height:58px;
    }
    .drink-sun-icon{
      width:42px;
      height:42px;
    }
    .drink-suggestion{
      font-size:.66rem;
    }
    .drink-suggestion strong{
      font-size:.75rem;
    }
    .welcome-hint{
      font-size:22px;
    }
  }

  @media (max-width:400px){
    .item-left{ gap:11px; }
    .item-image{ width:76px; height:76px; flex-basis:76px; border-radius:12px; }
  }
  @media (max-width:400px){
    .hero .menu-word{ font-size:2.9rem; }
    .hero .brand{ font-size:2.1rem; }
    .category h2{ font-size:1.6rem; }
  }
  .empty-msg{
    text-align:center;
    color:#888;
    padding:60px 20px;
    font-size:.9rem;
  }
  footer{
    text-align:center;
    padding:26px 10px 10px;
    color:#666;
    font-size:.72rem;
  }
</style>
</head>
<body>

<!-- Her tıklama veya dokunuşta kapanan açılış ekranı -->
<div class="welcome-screen" id="welcome-screen" role="button" tabindex="0" aria-label="Menüyü aç">
  <div class="welcome-content">
    <svg class="welcome-sun" viewBox="0 0 200 145" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- Açılış ekranındaki güneş ışınları -->
      <g class="sun-rays" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
        <line x1="100" y1="2"  x2="100" y2="12" />

      <g fill="none" stroke="currentColor" stroke-linecap="round">

<aside class="drink-helper" aria-label="İçecek önericisi">
  <button class="drink-sun-button" id="drink-sun-button" type="button" aria-label="Rastgele içecek öner">
    <svg class="drink-sun-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

        <line x1="50" y1="4" x2="50" y2="18" />
        <line x1="50" y1="82" x2="50" y2="96" />
        <line x1="4" y1="50" x2="18" y2="50" />
        <line x1="82" y1="50" x2="96" y2="50" />
        <line x1="17" y1="17" x2="27" y2="27" />

        <line x1="83" y1="17" x2="73" y2="27" />

  </button>
  <div class="drink-suggestion" id="drink-suggestion" aria-live="polite">

  <svg class="sun" viewBox="0 0 200 145" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gün batımı ve dalgalar">
    <g class="sun-object">
      <!-- Işınlar yayın dışında kalacak şekilde kısaltıldı. -->
      <g stroke="var(--red)" stroke-width="4" stroke-linecap="round">
        <line x1="100" y1="2"  x2="100" y2="12" />
        <line x1="70"  y1="5"  x2="74"  y2="16" />
        <line x1="130" y1="5"  x2="126" y2="16" />
        <line x1="42"  y1="18" x2="51"  y2="27" />
        <line x1="158" y1="18" x2="149" y2="27" />
        <line x1="24"  y1="42" x2="37"  y2="48" />
        <line x1="176" y1="42" x2="163" y2="48" />
        <line x1="15"  y1="64" x2="29"  y2="64" />
        <line x1="185" y1="64" x2="171" y2="64" />

      <!-- Güneş, dalgaların hemen üzerinde durur. -->
      <path d="M45 78 A55 55 0 0 1 155 78" fill="none" stroke="var(--red)" stroke-width="4" />
    </g>

    <!-- Dalgalar güneşle birlikte hareket eder ve güneş yerine geldiğinde durur. -->
    <g class="wave-object">
      <path d="M20 99 Q50 87 80 99 T140 99 T180 99" fill="none" stroke="var(--red)" stroke-width="3" />

  </svg>
  <div class="menu-word">Sunset</div>

<div class="accordion" id="content">
  <div class="empty-msg">Yükleniyor...</div>
</div>

<footer>Fiyatlara KDV dahildir · Sunset Cafe</footer>

<script>
// BURAYA ADMIN'DEKİ AYNI BİLGİLERİ GİR KANKA
bid
 BIN_ID = "6abe3cabffd5d16053425047"; 
const API_KEY = "2a$10$uh1HMT4kiKVQTPOmJQ/ZbubDJDgk8AH.izlkHbKe/EMZoKbhR3Ngy";

function formatPrice(p){
  const n = Number(p) || 0;
  return n.toFixed(2).replace(".00","") + " ₺";
}

function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

const PLACEHOLDER_IMAGE = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
  <svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
    <defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8b719"/><stop offset="1" stop-color="#c43a2b"/></linearGradient></defs>
    <rect width="140" height="140" rx="18" fill="#202020"/>
    <circle cx="70" cy="57" r="28" fill="url(#g)" opacity=".9"/>
    <path d="M30 118c8-24 23-36 40-36s32 12 40 36" fill="none" stroke="#fff7dc" stroke-width="8" stroke-linecap="round" opacity=".85"/>
    <circle cx="60" cy="55" r="4" fill="#202020"/><circle cx="80" cy="55" r="4" fill="#202020"/>
    <path d="M58 68c8 6 16 6 24 0" fill="none" stroke="#202020" stroke-width="4" stroke-linecap="round"/>
  </svg>`);

function getImageUrl(url){
  const value = String(url || '').trim();
  return /^(https?:\/\/|data:image\/)/i.test(value) ? value : PLACEHOLDER_IMAGE;
}

function loadMenu(){
  fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
    headers: { 'X-Master-Key': API_KEY }
  })
  .then(res => res.json())
  .then(json => {
    const fetchedData = json.record || [];
    if(fetchedData.length > 0) {
      render(fetchedData);
    } else {
      document.getElementById("content").innerHTML = '<div class="empty-msg">Menü henüz hazırlanıyor veya boş.</div>';
    }
  })
  .catch(err => {
    document.getElementById("content").innerHTML = '<div class="empty-msg">Bağlantı hatası. Menü yüklenemedi.</div>';
  });
}

let currentMenuData = [];

function render(data){
  currentMenuData = data;
  const contentEl = document.getElementById("content");
  contentEl.innerHTML = "";

  data.forEach((cat, idx) => {
    const section = document.createElement("div");
    section.className = "category" + (idx===0 ? " open" : "");
    section.style.setProperty("--category-index", idx);
    section.id = "sec-"+cat.id;

    let itemsHtml = "";
    if (cat.items) {
      itemsHtml = cat.items.map(it => `
        <div class="item">
          <div class="item-left">
            <img class="item-image" src="${escapeHtml(getImageUrl(it.image))}" alt="${escapeHtml(it.name)}" loading="lazy" onerror="this.onerror=null;this.src=PLACEHOLDER_IMAGE;">
            <span class="name">${escapeHtml(it.name)}${it.note ? `<span class="note">${escapeHtml(it.note)}</span>` : ""}</span>
          </div>
          <span class="price">${formatPrice(it.price)}</span>
        </div>`).join("");
    }

    section.innerHTML = `
      <div class="cat-header">
        <h2>${escapeHtml(cat.name)}</h2>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
      <div class="cat-body">
        <div class="cat-body-inner">
          <div class="cat-items">${itemsHtml}</div>
        </div>
      </div>`;

    section.querySelector(".cat-header").addEventListener("click", () => {
      section.classList.toggle("open");
    });

    contentEl.appendChild(section);
  });
}

const drinkButton = document.getElementById("drink-sun-button");
const drinkSuggestion = document.getElementById("drink-suggestion");
let hasSuggestedOnce = false;

function suggestRandomDrink(){
  const drinkKeywords = [
    "içecek", "kahve", "coffee", "çay", "tea", "soğuk",
    "sıcak", "meşrubat", "smoothie", "kokteyl", "bar", "drink"
  ];

  const allItems = currentMenuData.flatMap(category =>
    (category.items || []).map(item => ({
      ...item,
      categoryName: category.name
    }))
  );

  const drinks = allItems.filter(item => {
    const categoryText = String(item.categoryName || "").toLocaleLowerCase("tr-TR");
    const itemText = String(item.name || "").toLocaleLowerCase("tr-TR");
    return drinkKeywords.some(keyword =>
      categoryText.includes(keyword) || itemText.includes(keyword)
    );
  });

  const isWater = item => {
    const itemText = String(item.name || "").toLocaleLowerCase("tr-TR").trim();
    return /^(su|water)$/.test(itemText) || itemText.includes("şişe su") || itemText.includes("soda suyu");
  };

  // Su, öneri havuzundan çıkarılır; diğer içecekler korunur.
  const nonWaterDrinks = drinks.filter(item => !isWater(item));
  const nonWaterItems = allItems.filter(item => !isWater(item));
  const candidates = nonWaterDrinks.length ? nonWaterDrinks : nonWaterItems;
  const sunsetSpecial = allItems.find(item =>
    String(item.name || "").toLocaleLowerCase("tr-TR").includes("sunset special")
  );

  if(!candidates.length){
    drinkSuggestion.innerHTML = "Menü yükleniyor...";
    return;
  }

  // İlk tıklama daima Sunset Special; sonraki tıklamalar gerçekten rastgele.
  const selected = !hasSuggestedOnce && sunsetSpecial
    ? sunsetSpecial
    : candidates[Math.floor(Math.random() * candidates.length)];
  hasSuggestedOnce = true;

  drinkSuggestion.innerHTML = `
    <span>Bugün bunu dene:</span>
    <strong>${escapeHtml(selected.name)}</strong>`;
  drinkSuggestion.classList.remove("showing");
  void drinkSuggestion.offsetWidth;
  drinkSuggestion.classList.add("showing");
}

drinkButton.addEventListener("click", suggestRandomDrink);

const welcomeScreen = document.getElementById("welcome-screen");
let welcomeClosed = false;

function closeWelcome(){
  if(welcomeClosed) return;
  welcomeClosed = true;
  welcomeScreen.classList.add("closing");
  window.setTimeout(() => welcomeScreen.remove(), 800);
}

welcomeScreen.addEventListener("pointerup", closeWelcome);
welcomeScreen.addEventListener("keydown", (event) => {
  if(event.key === "Enter" || event.key === " "){
    event.preventDefault();
    closeWelcome();
  }
});

loadMenu();
</script>
